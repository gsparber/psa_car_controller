repos:
    -   repo: local
        hooks:
        -   id: autopep8
            name: autopep8
            entry: autopep8 -i
            language: system
            types: [python]
            require_serial: true
        # on the whole repository: given single files, prospector applies no ignore-paths
        -   id: prospector
            name: prospector
            entry: prospector --without-tool dodgy
            language: system
            pass_filenames: false
