[project]
name = "psa-car-controller"
version = "0.0.0"
description = "This is a python program to control a psa car with connected_car v4 api."
authors = [{ name = "Florian Bezannier", email = "florian.bezannier@hotmail.fr" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13, <4.0.0"
dependencies = [
    "paho-mqtt>=2.1.0,<3.0.0",
    "dash>=4.0.0,<5.0.0",
    "plotly>=7.0.0,<8.0.0",
    "cryptography>=2.6",
    "Werkzeug>=1.0.0",
    "Flask>=1.0.4",
    "dash-bootstrap-components>=2",
    "ConfigUpdater>=3.0",
    "oauth2-client>=1.3.0,<2.0.0",
    "requests>=2.27.1,<3.0.0",
    "geojson>=3.0.0,<4.0.0",
    "reverse-geocode>=1.4.1,<2.0.0",
    "androguard>=4.1.2,<5.0.0",
    "playwright>=1.44.0; platform_machine not in 'armv7l'",
    "pycryptodomex==3.24.1",  # Pin version as they introduce breaking changes in minor versions
    "pydantic>=2.4.0,<3.0.0",
    "ruamel.yaml>=0.15.0",
    "certifi>=2026.10.19",
    "six>=1.10",
    "python-dateutil>=2.5.3",
    "urllib3>=2.0.0,<3.0.0",
    "pandas>=2.2.3,<3.0.0",  # 2.2.3 is the one of Debian 13, the image uses it
    "numpy>=2.0.0",
    "scipy>=1.9.2",
]

[project.urls]
homepage = "https://github.com/flobz/psa_car_controller"
repository = "https://github.com/flobz/psa_car_controller"

[project.scripts]
psa-car-controller = "psa_car_controller.__main__:main"

[tool.poetry.group.dev.dependencies]
prospector = "1.20.0"
pre-commit = "4.7.0"
coverage = "7.17.0"
deepdiff = "9.1.0"
autopep8 = "2.3.2"
pylint = "4.1.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3
exclude = "psa_car_controller/__main__.py,psa_car_controller/psa/connected_car_api"
