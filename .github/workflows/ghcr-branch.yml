name: Publish branch Docker image to GHCR
# Only a version tag (next-v4.0.1) or a manual run builds images: a push to a branch runs the tests only (test.yml)
on:
  push:
    tags:
      - 'next-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# a newer run for the same tag or branch supersedes the image being built
concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: psa_car_controller

jobs:
  # no image of a commit which fails its tests
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read

  # each platform builds on a native runner: arm64 under QEMU took well over 25 min
  # (scipy, pandas and playwright emulated), natively it is as fast as amd64.
  # Two variants: with the browser for the headless login, and -slim without playwright and Chromium
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.variant }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: [full, slim]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: full
            browser: 'true'
          - variant: slim
            browser: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the history and the tags
          fetch-depth: 0
      - name: Read git state
        id: git
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps -w dist .
      - name: Prepare
        id: prep
        run: |
          echo "image=ghcr.io/$(echo "${{ github.repository_owner }}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            PSACC_BROWSER=${{ matrix.browser }}
            PSACC_GIT_VERSION=${{ steps.git.outputs.version }}
            PSACC_GIT_REPO_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.prep.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # joins the per-platform images: branch aliases, or versioned next tags for Renovate
  merge:
    name: Push multi-arch tags ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ''
          - variant: slim
            suffix: '-slim'
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.variant }}
          merge-multiple: true
      - name: Prepare
        id: prep
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          SUFFIX='${{ matrix.suffix }}'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # A numeric version first lets Renovate's Docker versioning keep the next/slim variants.
            if [[ ! "$GITHUB_REF_NAME" =~ ^next-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a tag like next-v4.0.1" >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME#next-v}-next"
            # next and next-slim follow the newest version: branch pushes don't build them anymore
            TAGS="-t ${IMAGE}:${TAG}${SUFFIX} -t ${IMAGE}:next${SUFFIX}"
          else
            # a manual run on a branch: feature/modern-ui -> feature-modern-ui
            TAG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-120)
            TAGS="-t ${IMAGE}:${TAG}${SUFFIX} -t ${IMAGE}:${TAG}-${GITHUB_SHA::7}${SUFFIX}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.prep.outputs.tags }} \
            $(printf '${{ steps.prep.outputs.image }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}
