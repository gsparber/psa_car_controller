name: Publish branch Docker image to GHCR
on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push_to_ghcr:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps -w dist .
      - name: Prepare
        id: prep
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}/psa_car_controller" | tr '[:upper:]' '[:lower:]')
          # docker tags allow [a-z0-9_.-] only: feature/modern-ui -> feature-modern-ui
          TAG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-120)
          echo "tags=${IMAGE}:${TAG},${IMAGE}:${TAG}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
