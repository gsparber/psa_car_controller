name: test
on:
  # the other branches run it through ghcr-branch.yml, before their image
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, next ]
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          sudo apt-get install libblas3 liblapack3 liblapack-dev libblas-dev gfortran libatlas-base-dev
          poetry config --local virtualenvs.in-project true
          poetry install --no-interaction
      - name: check quality
        run: |
          source .venv/bin/activate
          pre-commit run -a
      - name: test app
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          echo Test
          source .venv/bin/activate
          coverage run -m unittest || exit 11
          coverage combine
          coverage report
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            coverage xml -o cobertura.xml
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r cobertura.xml
          else
            echo no CODACY_PROJECT_TOKEN
          fi
