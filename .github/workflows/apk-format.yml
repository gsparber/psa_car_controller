---
# The other tests replace androguard and GitHub: this one notices when the application published
# on github.com/flobz/psa_apk changes its format. It doesn't log in to any Stellantis server.
name: apk format
on:
  schedule:
    - cron: '37 3 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          sudo apt-get install libblas3 liblapack3 liblapack-dev libblas-dev gfortran libatlas-base-dev
          poetry config --local virtualenvs.in-project true
          poetry install --no-interaction
      - name: read the published application
        env:
          TEST_ONLINE: "1"
          PSACC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          source .venv/bin/activate
          python -m unittest -v tests.test_unit.TestUnit.test_parse_apk_online 2>&1 | tee "$RUNNER_TEMP/result.txt"
          # a skipped test exits with 0 too: it must not pass for a successful check
          grep -qx OK "$RUNNER_TEMP/result.txt"
